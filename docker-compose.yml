services:
  vzdnur-contact-api:
    build:
      context: .
    image: vzdnur-contact-api:latest
    container_name: vzdnur-contact-api
    environment:
      - TURNSTILE_SECRET_KEY
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASS
      - CONTACT_TO_EMAIL
      - CONTACT_FROM_EMAIL
      - PORT
    networks:
      - default
      - vzdnur_services
      - mailu_default
    restart: unless-stopped

networks:
  default:
    driver: bridge
  vzdnur_services:
    external: true
  mailu_default:
    external: true
